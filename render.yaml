# Render Blueprint. Deploys:
#   - pr-review-web:    FastAPI webhook receiver (public web service)
#   - pr-review-worker: Celery worker (background worker, no public URL)
#   - redis-stack:      redis/redis-stack-server, self-hosted as a private
#                        service specifically because the LangGraph
#                        checkpointer (AsyncRedisSaver) needs the RediSearch +
#                        RedisJSON modules -- Render's own managed "Key Value"
#                        Redis offering doesn't support custom modules, and
#                        this is the module-capable replacement for what was
#                        Azure Managed Redis Enterprise. It's reachable only
#                        from pr-review-web/pr-review-worker over Render's
#                        private network, never the public internet, so the
#                        connection is plain redis:// with no TLS -- avoiding
#                        the ssl_cert_reqs casing split between redis-py and
#                        Kombu that a TLS-fronted managed Redis would require.
#
# Secrets marked `sync: false` are NOT stored in this file -- set their real
# values once in the Render dashboard per service (or on the shared env var
# group) after the first blueprint deploy.

envVarGroups:
  - name: pr-review-shared
    envVars:
      # All three point at the same self-hosted redis-stack instance and DB
      # index, same pattern as docker-compose.yml's redis_broker service --
      # internal-network hostname resolves to the redis-stack service below
      # by its `name`.
      - key: REDIS_URL
        value: redis://redis-stack:6379/0
      - key: CELERY_BROKER_URL
        value: redis://redis-stack:6379/0
      - key: CELERY_RESULT_BACKEND
        value: redis://redis-stack:6379/0
      - key: GIT_WORKSPACE_ROOT
        value: /app/workspace
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: pr-review-agent
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false

services:
  - type: web
    name: pr-review-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./entrypoint-web.sh
    plan: starter
    region: singapore
    autoDeploy: true
    # Mirrors deploy-azure.yml's old `paths:` trigger filter -- a change to
    # only evaluation/ or tests/ shouldn't redeploy either service.
    buildFilter:
      paths:
        - app/**
        - mcp_servers/**
        - docker/**
        - Dockerfile
        - requirements.lock
    envVarGroups:
      - pr-review-shared
    envVars:
      # entrypoint-web.sh reads $PORT with an 8000 fallback; Render injects
      # its own PORT and expects the container to listen on it, so this
      # value must match whatever Render actually assigns for HTTP routing.
      - key: PORT
        value: 8000

  - type: worker
    name: pr-review-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./entrypoint-worker.sh
    plan: starter
    region: singapore
    autoDeploy: true
    buildFilter:
      paths:
        - app/**
        - mcp_servers/**
        - docker/**
        - Dockerfile
        - requirements.lock
    envVarGroups:
      - pr-review-shared

  - type: pserv
    name: redis-stack
    runtime: image
    image:
      url: docker.io/redis/redis-stack-server:latest
    plan: starter
    region: singapore
    autoDeploy: false
    envVars:
      # appendonly on top of the image's default RDB save points -- worth
      # the extra durability since LangGraph checkpoints have no TTL and
      # exist specifically so a worker crash mid-review doesn't lose
      # progress (see CLAUDE.md); losing the whole checkpoint store on a
      # container restart would defeat that.
      - key: REDIS_ARGS
        value: "--appendonly yes"
    disk:
      name: redis-data
      # redis-stack-server's default redis-stack.conf already sets `dir
      # /data`, so mounting the persistent disk there is enough -- no extra
      # config file needed.
      mountPath: /data
      sizeGB: 1
